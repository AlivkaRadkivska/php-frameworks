version: '3.8'

services:
  db-lar-online-learning:
    image: mysql:5.7
    volumes:
      - db-lar-online-learning-data:/var/lib/mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db-lar-online-learning
      MYSQL_PASSWORD: password
    networks:
      - db-lar-online-learning-net

  db-lar-online-learning-phpmyadmin:
    depends_on:
      - db-lar-online-learning
    image: phpmyadmin
    restart: always
    ports:
      - "8090:80"
    environment:
      PMA_HOST: db-lar-online-learning
      MYSQL_ROOT_PASSWORD: password
    networks:
      - db-lar-online-learning-net

networks:
  db-lar-online-learning-net:

volumes:
  db-lar-online-learning-data:
